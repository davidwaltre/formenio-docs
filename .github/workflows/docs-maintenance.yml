name: Docs Maintenance

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  docs-maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write CNAME file
        run: echo "docs.formenio.de" > docs/CNAME

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "fix: restore CNAME [skip ci]" && git push || true
